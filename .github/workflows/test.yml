name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-build.lock
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Validate Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install-linux.sh tests/test-linux-installer.sh
          sh tests/test-linux-installer.sh
          sed 's|@PCIMS_PYTHON@|/usr/bin/python3|' packaging/linux/pcims.desktop > /tmp/pcims.desktop
          desktop-file-validate /tmp/pcims.desktop
      - name: Validate Windows installer rollback
        if: runner.os == 'Windows' && matrix.python-version != '3.13'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test-windows-installer.ps1
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - name: Run the fail-fast release gate
        run: python scripts/verify.py --output-directory dist
      - name: Install and smoke built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          smoke_script="$(pwd)/scripts/smoke-installed.py"
          python -m pip uninstall -y pcims
          python -m pip install --no-deps "$wheel"
          python -m pip check
          smoke_directory="$(mktemp -d)"
          cd "$smoke_directory"
          python "$smoke_script"
      - name: Install the real Linux desktop application
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: |
          install_data="$RUNNER_TEMP/pcims-linux-install"
          XDG_DATA_HOME="$install_data" PYTHON=python sh scripts/install-linux.sh
          desktop-file-validate "$install_data/applications/pcims.desktop"
          test -x "$install_data/pcims/application/bin/python"
      - name: Install the real Windows desktop application
        if: runner.os == 'Windows' && matrix.python-version == '3.13'
        env:
          PCIMS_RUN_REAL_INSTALL: "1"
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test-windows-installer.ps1
