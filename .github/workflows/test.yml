name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Validate Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install-linux.sh tests/test-linux-installer.sh
          sh tests/test-linux-installer.sh
          sed 's|@PCIMS_PYTHON@|/usr/bin/python3|' packaging/linux/pcims.desktop > /tmp/pcims.desktop
          desktop-file-validate /tmp/pcims.desktop
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -X dev -W error -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy pcims --strict --no-error-summary
      - run: bandit -q -r pcims
      - run: python -m build
      - name: Install and smoke built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          smoke_script="$(pwd)/scripts/smoke-installed.py"
          python -m pip uninstall -y pcims
          python -m pip install --no-deps "$wheel"
          python -m pip check
          smoke_directory="$(mktemp -d)"
          cd "$smoke_directory"
          python "$smoke_script"
