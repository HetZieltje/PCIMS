name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Validate Linux desktop integration
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install-linux.sh
          sed 's|@PCIMS_EXECUTABLE@|/tmp/pcims|' packaging/linux/pcims.desktop > /tmp/pcims.desktop
          desktop-file-validate /tmp/pcims.desktop
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -X dev -W error -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy pcims --ignore-missing-imports --no-error-summary
      - run: bandit -q -r pcims
      - run: python -m build
