name: Package preview

on:
  push:
    branches: [pyside6-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: package-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: AMD64
            artifact-name: windows-x64
            release-suffix: Windows-x64
            archive-extension: zip
          - os: ubuntu-22.04
            architecture: x86_64
            artifact-name: linux-x86_64
            release-suffix: Linux-x86_64
            archive-extension: tar.gz
          - os: macos-15
            architecture: arm64
            artifact-name: macos-arm64
            release-suffix: macOS-arm64
            archive-extension: zip
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-package.lock
      - name: Validate native architecture
        shell: bash
        run: test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.architecture }}"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install locked packaging environment
        run: python -m pip install --require-hashes -r requirements-package.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - name: Read application version
        id: version
        shell: bash
        run: |
          version="$(python -c 'from pcims.version import application_version; print(application_version())')"
          echo "PCIMS_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean --windowed --name PCIMS app.py
      - name: Smoke Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PCIMS_PACKAGED_SMOKE_TEST = "1"
          $env:PCIMS_DB_PATH = Join-Path $env:RUNNER_TEMP "pcims-package-smoke.db"
          & "dist/PCIMS/PCIMS.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke Linux application
        if: runner.os == 'Linux'
        run: |
          PCIMS_PACKAGED_SMOKE_TEST=1 \
          PCIMS_DB_PATH="$RUNNER_TEMP/pcims-package-smoke.db" \
          ./dist/PCIMS/PCIMS
      - name: Smoke macOS application
        if: runner.os == 'macOS'
        run: |
          PCIMS_PACKAGED_SMOKE_TEST=1 \
          PCIMS_DB_PATH="$RUNNER_TEMP/pcims-package-smoke.db" \
          ./dist/PCIMS.app/Contents/MacOS/PCIMS
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Compress-Archive -Path "dist/PCIMS" -DestinationPath "artifacts/PCIMS-$env:PCIMS_VERSION-Windows-x64.zip"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir artifacts
          tar -C dist -czf "artifacts/PCIMS-${PCIMS_VERSION}-Linux-x86_64.tar.gz" PCIMS
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/PCIMS.app "artifacts/PCIMS-${PCIMS_VERSION}-macOS-arm64.zip"
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: artifacts/PCIMS-${{ steps.version.outputs.version }}-${{ matrix.release-suffix }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/PCIMS-${{ steps.version.outputs.version }}-${{ matrix.release-suffix }}.${{ matrix.archive-extension }}
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/PCIMS-${{ steps.version.outputs.version }}-${{ matrix.release-suffix }}.${{ matrix.archive-extension }}
          sbom-path: artifacts/PCIMS-${{ steps.version.outputs.version }}-${{ matrix.release-suffix }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download native packages and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-*'
          path: release-artifacts
          merge-multiple: true
      - name: Write deterministic SHA-256 manifest
        run: python scripts/write_checksums.py release-artifacts
      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
