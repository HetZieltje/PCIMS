name: Package preview

on:
  push:
    branches: [pyside6-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: AMD64
            artifact-name: windows-x64
          - os: ubuntu-22.04
            architecture: x86_64
            artifact-name: linux-x86_64
          - os: macos-15
            architecture: arm64
            artifact-name: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-package.lock
      - name: Validate native architecture
        shell: bash
        run: test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.architecture }}"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install locked packaging environment
        run: python -m pip install --require-hashes -r requirements-package.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - name: Read application version
        shell: bash
        run: echo "PCIMS_VERSION=$(python -c 'from pcims.version import application_version; print(application_version())')" >> "$GITHUB_ENV"
      - name: Build native application
        run: python -m PyInstaller --noconfirm --clean --windowed --name PCIMS app.py
      - name: Smoke Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PCIMS_PACKAGED_SMOKE_TEST = "1"
          $env:PCIMS_DB_PATH = Join-Path $env:RUNNER_TEMP "pcims-package-smoke.db"
          & "dist/PCIMS/PCIMS.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke Linux application
        if: runner.os == 'Linux'
        run: |
          PCIMS_PACKAGED_SMOKE_TEST=1 \
          PCIMS_DB_PATH="$RUNNER_TEMP/pcims-package-smoke.db" \
          ./dist/PCIMS/PCIMS
      - name: Smoke macOS application
        if: runner.os == 'macOS'
        run: |
          PCIMS_PACKAGED_SMOKE_TEST=1 \
          PCIMS_DB_PATH="$RUNNER_TEMP/pcims-package-smoke.db" \
          ./dist/PCIMS.app/Contents/MacOS/PCIMS
      - name: Archive Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Compress-Archive -Path "dist/PCIMS" -DestinationPath "artifacts/PCIMS-$env:PCIMS_VERSION-Windows-x64.zip"
      - name: Archive Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir artifacts
          tar -C dist -czf "artifacts/PCIMS-${PCIMS_VERSION}-Linux-x86_64.tar.gz" PCIMS
      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/PCIMS.app "artifacts/PCIMS-${PCIMS_VERSION}-macOS-arm64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
