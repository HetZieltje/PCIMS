[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcims"
version = "2.0.0b1"
description = "Cross-platform PC inventory, assembly, and sales manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.17,<2",
    "ruff>=0.12,<1",
]
packaging = ["pyinstaller==6.22.2"]

[project.gui-scripts]
pcims = "pcims.app.application:main"

[tool.setuptools.packages.find]
include = ["pcims*"]
