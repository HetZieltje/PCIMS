[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcims"
version = "1.0.0"
description = "Cross-platform PC inventory, assembly, and sales manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
pcims = "pcims.app.application:main"

[tool.setuptools.packages.find]
include = ["pcims*"]
